name: Daily digest

on:
  # GitHub's scheduler is best-effort: on this repo it has started runs ~6 hours late,
  # and sometimes skips them. So the digest is scheduled overnight, several times. The
  # gate job builds once per US-Eastern day (the first run after midnight ET wins) and
  # the rest exit in seconds. Off-the-hour minutes avoid GitHub's busiest moments.
  schedule:
    - cron: "17 5 * * *" # 12:17 AM EST / 1:17 AM EDT
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 10 * * *" # 5:17 AM EST
  workflow_dispatch:
    inputs:
      check_feeds:
        description: "Only test which sources can be fetched (no digest, no deploy)"
        type: boolean
        default: false

permissions:
  contents: write # commit state/ (seen items, feedback log, learned taste, page cache)
  issues: write # read and close "Digest feedback" issues
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: state
      - id: check
        run: |
          today=$(TZ=America/New_York date +%F)
          last=$(jq -r '.last_built // ""' state/meta.json 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "Today's digest ($today) is already built; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check sources only
        if: ${{ inputs.check_feeds }}
        run: python digest.py --check-feeds

      - name: Build digest
        if: ${{ !inputs.check_feeds }}
        run: python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit state
        if: ${{ !inputs.check_feeds }}
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Digest state for $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.check_feeds }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.check_feeds }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ !inputs.check_feeds }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
