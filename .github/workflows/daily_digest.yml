name: Daily digest

on:
  schedule:
    - cron: "30 10 * * *" # 5:30 AM EST / 6:30 AM EDT (GitHub may start it a bit late)
  workflow_dispatch:
    inputs:
      check_feeds:
        description: "Only test which sources can be fetched (no digest, no deploy)"
        type: boolean
        default: false

permissions:
  contents: write # commit state/ (seen items, feedback log, learned taste, page cache)
  issues: write # read and close "Digest feedback" issues
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check sources only
        if: ${{ inputs.check_feeds }}
        run: python digest.py --check-feeds

      - name: Build digest
        if: ${{ !inputs.check_feeds }}
        run: python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit state
        if: ${{ !inputs.check_feeds }}
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Digest state for $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.check_feeds }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.check_feeds }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ !inputs.check_feeds }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
