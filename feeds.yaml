# Sources the digest pulls from. The original list was verified working from GitHub Actions on
# 2026-11-06; the sources added 2026-11-13 were verified from a laptop only.
# Substack newsletters on substack.com have refused requests from GitHub's servers (403), so
# most are left out and the few included are marked; run `python digest.py --check-feeds` (or the workflow with
# check_feeds=true) to see which sources work.
#
#   name:      shown on the page
#   url:       RSS/Atom feed, or (with type: page) a blog index page to watch
#   category:  a hint to the ranker, not a filter
#   type:      optional. "page" = no usable feed, so watch the page for new post links
#   link_pattern: (type: page only) regex that post URLs must match
#
# Some quiet-but-excellent blogs are kept even if they post rarely. They cost nothing
# on days they're silent. "wildcard" sources mainly feed the wildcard slot.

